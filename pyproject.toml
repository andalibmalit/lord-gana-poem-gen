[project]
name = "lord-gana-poem-gen"
version = "0.2.0"
description = "Generate devotional poems to Lord Gana with local LLMs, keep every poem with its settings, and read them blind."
readme = "README.md"
authors = [{ name = "Andalib Samandari", email = "andalibmalit@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    # Pinned: the existing mlflow.db uses this version's schema. Upgrading may migrate it.
    "mlflow==3.17.2",
    "pyyaml>=6.0",
]

[project.scripts]
poemgen = "poemgen.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "poemgen"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=8",
    "ruff>=0.17.1",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "PLW1514"]
# ANN: every function in src/ has type hints (ty checks them). Any is allowed for YAML/JSON data.
ignore = ["ANN401"]
# PLW1514 (open() without an explicit encoding) is a preview rule: enable just that one.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `ollama` talk to the real local Ollama; run them with `pytest -m ollama`.
addopts = "-m 'not ollama'"
markers = ["ollama: needs the real local Ollama (opt-in)"]
