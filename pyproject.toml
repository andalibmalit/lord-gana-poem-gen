[project]
name = "lord-gana-poem-gen"
version = "0.1.0"
description = "Exploring LLMs' abilities to generate devotional poems to Lord Gana."
readme = "README.md"
authors = [
  { name = "Andalib Samandari", email = "andalibmalit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "kernels>=0.17.2",
    "marimo>=0.25.2",
    "mlflow>=3.17.2",
    "polars>=2.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers >=4.45.2, <= 5.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
