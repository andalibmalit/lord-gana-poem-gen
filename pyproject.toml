[project]
name = "lord-gana-poem-gen"
version = "0.2.0"
description = "Generate devotional poems to Lord Gana with local LLMs, keep every poem with its settings, and read them blind."
readme = "README.md"
authors = [{ name = "Andalib Samandari", email = "andalibmalit@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    # Pinned: the existing mlflow.db uses this version's schema. Upgrading may migrate it.
    "mlflow==3.17.2",
    "pyyaml>=6.0",
]

[project.scripts]
poemgen = "poemgen.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "poemgen"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]
# PLW1514 (open() without an explicit encoding) is a preview rule: enable just that one.
preview = true
explicit-preview-rules = true

[tool.pytest.ini_options]
testpaths = ["tests"]
