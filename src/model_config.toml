# Stores models and parameters for generation. Also includes a brief (very) high-level of what makes a particular model interesting to study. For practical reasons, we focus on models that can run on an upper-mid-tier personal computer. Future work may include comparison with larger models, including closed weights frontier models. Open weights models also facilitate future work in finetuning, interpretability etc.

# Default params for all models
[default]
# note that max_new_tokens includes both reasoning and output tokens
max_new_tokens = 3333
seed = 333997

# individual model 
[[llm]]
# might add an "alias" field, if I have to list the same model multiple times for reasoning on/off...
name = "NousResearch/Hermes-4-14B"
description = "As stated in their model card's mission statement Nous Research aims to create models that are 'open, steerable and capable of producing the full range of human expression, while being able to be aligned to your values'. Does this make it easier for a desired flavor of consciousness to be transmitted or evoked by model outputs, given a system prompt, user prompt and other parameters?"
commit_hash = "d6ce765c8b83f847357b98254be079afa0c6ca76"
[llm.quantization]
quantize = true
bits = 4
group_size = 32
# add a field like quantized_name to fetch the quantized version from MLFlow model registry

[[llm]]
name = "allenai/Olmo-3-7B-Instruct"
description = "The Allen Institute for AI produces fully open source models, making it easier to potentially evaluate causal effects across the entire training stack on model outputs. Also just excited to try out a fully open model :)"
commit_hash = "6e5971d9eba42665f5bd5a0fcf047f299ce1dccc"
[llm.quantization]
quantize = false

[[llm]]
name = "allenai/Olmo-3-7B-Think"
description = "The reasoning equivalent from Allen AI."
