# The model set. This file is the source of truth for which build of each model runs:
# `poemgen models pull` pulls exactly `tag`, and `poemgen run` refuses a model whose
# local digest differs from `ollama_digest`, or whose build isn't `confirmed`.
#
# Fields
#   tag               Ollama tag (library name or hf.co/<user>/<repo>:<quant>)
#   upstream          the Hugging Face model the GGUF was converted from
#   weights_sha256    digest of the GGUF weights layer in the registry manifest (`models check`)
#   ollama_digest     /api/tags digest after the pull (`models pull` prints it)
#   ctx_max           longest context the model was trained for; num_ctx is capped to it
#   think_values      values Ollama accepts for `think`; [] = no thinking switch
#   think_default     the value used when an experiment asks for the model's default
#   stop              stop sequences from the build's params, sent with every request
#   recommended       the maker's own settings (card or generation_config), with recommended_source;
#                     a `thinking` sub-table applies on top when thinking is on
#   inherited         settings taken from the base model or a config file when the maker states
#                     none, with inherited_source; the maker's own values win
#   unsupported       recommended settings Ollama doesn't have; recorded on each poem as not applied
#   build_notes       why this build: quant level, imatrix or not, lineage, template and stop checks
#
# Recommended values come from docs/recommended-sampling-settings.md (checked 30 Oct 2026).
# Entries with confirmed = false still need the build research (plan step 4).

# --- Headroom: fits easily in the 26.8 GB budget at num_ctx 40960 ---------------------------

