# Values that belong to this machine, not to the models or experiments.
# For another machine: copy this file, edit it, and point POEMGEN_MACHINE (or --machine) at the copy.

name = "m2-max-32gb"
ollama_host = "http://127.0.0.1:11434"

# GPU memory budget, from torch.mps.recommended_max_memory() on this Mac. A note for
# memory planning only: the tool doesn't enforce it. Ollama's /api/ps size_vram is
# recorded after each model's first poem, with a warning if the model spilled to the CPU.
gpu_budget_gb = 26.8

# Requests sent at once. Must equal the Ollama server's OLLAMA_NUM_PARALLEL (default 1).
# That server setting applies to every model and multiplies its context memory
# (num_ctx × parallel), so raise it only for runs of small models.
parallel = 1

request_timeout_minutes = 60
keep_alive = "10m"        # how long Ollama keeps a model loaded between requests
minutes_per_poem = 3      # time estimate for models with no poems yet

# Ollama server settings that change outputs but can't be sent per request or read
# through the API. Write here what the server was started with ("" = not set, so the
# server default applies). Each poem records them as declared values.
[ollama_env]
OLLAMA_NUM_PARALLEL = ""      # parallel slots (default 1); keep `parallel` above equal to it
OLLAMA_KV_CACHE_TYPE = ""     # context-cache precision (default f16; q8_0 / q4_0 change outputs)
OLLAMA_FLASH_ATTENTION = ""   # attention kernel (changes the arithmetic slightly)
LLAMA_ARG_CACHE_RAM = "0"     # llama-server prompt cache in system RAM (default 8 GiB); set via launchctl, see README

# Largest num_ctx this machine can hold for a model (weights + context within the budget).
# From llama-server's own memory accounting (adversarial review, 30 Oct); check them on the first load.
[num_ctx_caps]
"hermes4.3-36b" = 20480
"seed-oss-36b" = 24576
